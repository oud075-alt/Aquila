[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mspis"
version = "0.1.0"
description = "Market Structural Pathology Intelligence System — structural market cognition, not a trading bot."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MSPIS" }]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "structlog>=24.1",
    "anyio>=4.3",
    "httpx>=0.27",
    "websockets>=12.0",
    "PyYAML>=6.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "hypothesis>=6.100",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "brain*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "N", "ANN", "ASYNC", "RUF",
]
ignore = [
    "ANN401",
    "ASYNC109",
    "ASYNC240",
    "E501",
    "RUF005",
    "RUF012",
    "RUF046",
    "UP037",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "pyarrow.*", "pandas.*", "websockets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["core.persistence.timeseries_store", "core.ingestion.replay_adapter"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
