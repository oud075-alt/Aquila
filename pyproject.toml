[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mspis"
version = "1.0.0"
description = "Market Structural Pathology Intelligence System — diagnose internal market disease before price collapse or expansion becomes visible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "MSPIS Intelligence" }]
keywords = ["market", "structural", "pathology", "intelligence", "diagnosis"]

[tool.setuptools]
packages = ["brain", "api", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
