name: SEC E2E Temporary

on:
  push:
    branches:
      - tmp-sec-e2e-20260903
  workflow_dispatch:

jobs:
  live-sec:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Live data.sec.gov Companyfacts + TTM assertions
        id: live
        continue-on-error: true
        env:
          SEC_USER_AGENT: "VerifiedValueGrowthScanner/ci oud075-alt@users.noreply.github.com"
        run: |
          node sec-e2e/live_test.cjs > sec-e2e/result.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat sec-e2e/result.log
          exit $code
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec-e2e-diagnostics
          path: sec-e2e/result.log
      - name: Enforce gate
        if: always()
        run: |
          test "${{ steps.live.outputs.exit_code }}" = "0"
