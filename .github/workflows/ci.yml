name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy strict)
        run: mypy core brain api

      - name: Generate test fixture
        run: python -m tests.fixtures.generate_btcusdt_sample

      - name: Test (pytest)
        run: pytest -q

      - name: Behavior boundary CI (Appendix P) — explicit re-run
        run: pytest -q tests/test_behavior_boundary.py

      - name: Deterministic replay (Appendix S) — explicit re-run
        run: pytest -q tests/test_determinism.py
